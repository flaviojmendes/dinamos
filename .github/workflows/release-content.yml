name: Restore content seed (recovery)

# RECOVERY / SEED ONLY — re-applies idempotent content seed SQL and post-seed
# fixups to production Postgres. This does NOT publish CMS edits to the CDN.
# To ship published lesson snapshots, run "Publish static content to CDN".
on:
  workflow_dispatch:
    inputs:
      confirm_recovery:
        description: I understand this re-applies DB seed/fixups (not CDN publish)
        type: boolean
        default: false
        required: true

# Prevent overlapping recovery runs against the same database.
concurrency:
  group: release-content
  cancel-in-progress: false

jobs:
  restore:
    name: Apply content seed and fixups
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Require explicit confirmation
        if: ${{ !inputs.confirm_recovery }}
        run: |
          echo "Recovery aborted: enable confirm_recovery to re-apply DB seed/fixups."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
          NPM_CONFIG_FETCH_TIMEOUT: "300000"

      - name: Apply content seed and fixups
        run: npm run release:content
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
