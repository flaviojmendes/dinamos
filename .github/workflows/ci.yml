name: CI

# Gate merges into the default branch: run type checks, the build, and the
# full test suite on every pull request (and on pushes to main itself).
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # Survive transient registry hiccups (e.g. ECONNRESET) by retrying.
          NPM_CONFIG_FETCH_RETRIES: "5"
          NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
          NPM_CONFIG_FETCH_TIMEOUT: "300000"

      - name: Type-check (frontend + API)
        run: npm run typecheck

      - name: Validate bilingual course content
        run: npm run content:check

      - name: Native Node API cold start
        run: npm run test:api-runtime

      - name: Build (Vercel command, no DATABASE_URL)
        run: npm run vercel-build
        env:
          DATABASE_URL: ''
          # Initialize the real Firebase SDK for unauthenticated smoke tests.
          # These placeholders cannot authenticate against a production project.
          VITE_FIREBASE_API_KEY: 'ci-smoke-test-api-key'
          VITE_FIREBASE_AUTH_DOMAIN: 'demo-dinamos-ci.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'demo-dinamos-ci'
          VITE_FIREBASE_STORAGE_BUCKET: 'demo-dinamos-ci.appspot.com'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
          VITE_FIREBASE_APP_ID: '1:1234567890:web:ci-smoke-test'

      - name: Bundle budget
        run: npm run baseline:bundle && npm run baseline:bundle-budget

      - name: Scoring performance budget
        run: npm run baseline:scoring && npm run baseline:scoring-budget

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Install Playwright Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install chromium --with-deps

      - name: E2E smoke (Arena)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
        env:
          # Optional for public repos; required for private. Add it in repo secrets.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
